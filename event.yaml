# KM Putri Sakinah — Labuan Bajo / Selat Padar metocean analysis

event:
  name: KM Putri Sakinah
  # Local reports: ~20:30–21:00 WITA (UTC+8) on 26 Dec 2025
  time_local: "2025-12-26T20:30:00+08:00"
  time_utc: "2025-12-26T12:30:00Z"
  # Estimated sinking location (~23 nm west of Marina Labuan Bajo, Padar Strait)
  incident:
    lon: 119.55
    lat: -8.55
    label: Estimated sinking (Selat Padar)
  # Wreck found 6 Jan 2026 (~7.5 nm from sinking site)
  wreck:
    lon: 119.676895
    lat: -8.609761
    label: Wreck (6 Jan 2026)
  reported_swh_m: [2.0, 3.0]

domain:
  # 2° × 2° plot bbox [min_lon, max_lon, min_lat, max_lat]
  bbox: [118.55, 120.55, -9.55, -7.55]
  download_margin_deg: 0.5
  region_label: Labuan Bajo / Selat Padar

time_window:
  start: "2025-12-23T00:00:00Z"
  end: "2025-12-29T21:00:00Z"

refine:
  # Display densification only (~1.1 km at this latitude); native GFS is 0.25°
  target_deg: 0.01
  method: linear
  gaussian_sigma: 0.8
  apply_gaussian: true

datasets:
  primary:
    - gfs
    - hycom
  optional:
    - era5
    - cmems
  gfs:
    wave_step_hours: 3
    atmos_step_hours: 3
    products: [swh, swell, wind10m]
  hycom:
    step_hours: 3
    products: [seacurrent]
  era5:
    step_hours: 1
    products: [swh, swell, wind10m]
  cmems:
    step_hours: 1
    products: [seacurrent]

products:
  swh:
    display: Significant Wave Height
    unit: m
    palette: monsun_wave
    levels: [0, 0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3, 3.5, 4, 5, 6, 7]
    extend: max
  swell:
    display: Primary Swell
    unit: m
    palette: monsun_swell
    levels: [0, 0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3, 3.5, 4, 5, 6, 7]
    extend: max
  wind10m:
    display: 10 m Wind
    unit: kt
    palette: monsun_wind
    levels: [0, 2, 4, 6, 8, 10, 15, 20, 25, 30, 35, 40, 50, 60]
    extend: max
    scale: 1.94384  # m/s → kt for maps
  seacurrent:
    display: Surface Current
    unit: cm/s
    palette: monsun_current
    levels: [0, 5, 10, 20, 30, 45, 60, 80, 100, 150, 200, 300, 400]
    extend: max
    scale: 100.0  # m/s → cm/s for maps

paths:
  data_dir: data
  figures_dir: figures
  spatial_dir: figures/spatial
  point_dir: figures/point

plot:
  dpi: 120
  fileformat: png
  every: 1  # render every Nth native timestep (1 = all)
  key_times_utc:
    - "2025-12-26T12:00:00Z"
    - "2025-12-26T15:00:00Z"
